name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrobridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android, native host, and ARM32 fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and cache Gradle user home
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify preinstalled Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner did not provide ANDROID_HOME}"
          if [[ -z "${ANDROID_NDK_LATEST_HOME:-}" ]]; then
            echo "ANDROID_NDK_LATEST_HOME is missing on this runner." >&2
            exit 1
          fi
          : "${ANDROID_NDK_LATEST_HOME:?}"
          [[ -d "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64" ]]
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"
          echo "Installed SDK packages (relevant subset):"
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-35|build-tools;35|cmake;3.22' || true

      - name: Cache native CMake build directories
        uses: actions/cache@v4
        with:
          path: |
            native/build/host
            native/build/arm32-fixtures
            core/runtime/.cxx
          key: ${{ runner.os }}-retrobridge-cmake-${{ hashFiles('native/CMakeLists.txt', 'native/**/*.cpp', 'native/**/*.c', 'native/fixtures/**/*.gradle.kts', 'app/**/*.gradle.kts', 'core/runtime/src/main/cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-retrobridge-cmake-

      - name: Ensure Android API and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Cross-compile ARM32 fixtures and package signed demo APK
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$NDK_BIN/armv7a-linux-androideabi23-clang"
          mkdir -p native/build/arm32-fixtures diagnostics
          "$CC" -marm -fPIE -pie -nostdlib \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -Wl,-e,_start -Wl,--build-id=none \
            native/fixtures/arm32_guest_entry.c \
            -o native/build/arm32-fixtures/guest_arm32
          "$CC" -fPIC -shared \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -Wl,-soname,libretrobridge_fixture.so -Wl,--build-id=none -Wl,--no-as-needed \
            native/fixtures/arm32_shared_fixture.c \
            -o native/build/arm32-fixtures/libretrobridge_fixture.so
          "$CC" -marm -O2 -fPIC -shared -nostartfiles \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -Wl,-soname,libretrobridge_demo.so -Wl,--build-id=none -Wl,--no-as-needed \
            -Wl,--pack-dyn-relocs=none -Wl,--no-undefined \
            native/fixtures/arm32_native_demo.c -lc -lm \
            -o native/build/arm32-fixtures/libretrobridge_demo.so
          "$CC" -marm -mfpu=vfpv3-d16 -mfloat-abi=softfp -fPIE -pie -nostdlib \
            -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -Wl,-e,_start -Wl,--build-id=none \
            native/fixtures/arm32_vfp_guest.S \
            -o native/build/arm32-fixtures/guest_arm32_vfp
          mkdir -p native/build/arm32-fixtures/demo-jni-libs/armeabi-v7a native/build/arm32-fixtures/test-assets
          cp native/build/arm32-fixtures/libretrobridge_demo.so \
            native/build/arm32-fixtures/demo-jni-libs/armeabi-v7a/libretrobridge_demo.so
          file native/build/arm32-fixtures/* | tee diagnostics/arm32-fixtures.log
          "$NDK_BIN/llvm-readelf" -d native/build/arm32-fixtures/libretrobridge_demo.so \
            | tee diagnostics/arm32-demo-dynamic-dependencies.log
          "$NDK_BIN/llvm-objdump" -d native/build/arm32-fixtures/libretrobridge_demo.so \
            | tee diagnostics/arm32-demo-disassembly.log
          "$NDK_BIN/llvm-objdump" -d native/build/arm32-fixtures/guest_arm32_vfp \
            | tee diagnostics/arm32-vfp-disassembly.log
          gradle --no-daemon --stacktrace --console=plain :guestDemo:assembleDebug 2>&1 \
            | tee diagnostics/demo-apk.log
          DEMO_APK="$(find native/fixtures/demo-apk/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$DEMO_APK" || ! -s "$DEMO_APK" ]]; then
            echo "Gradle did not produce the demo APK under native/fixtures/demo-apk/build/outputs/apk/debug." >&2
            find native/fixtures/demo-apk/build/outputs -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$DEMO_APK" \
            | tee diagnostics/demo-apk-zipalign.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEMO_APK" \
            | tee diagnostics/demo-apk-signature.log
          cp "$DEMO_APK" native/build/arm32-fixtures/test-assets/guestdemo.apk

      - name: Configure and build native host verification
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B native/build/host \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRETROBRIDGE_ARM32_EXECUTABLE="$GITHUB_WORKSPACE/native/build/arm32-fixtures/guest_arm32" \
            -DRETROBRIDGE_ARM32_VFP_EXECUTABLE="$GITHUB_WORKSPACE/native/build/arm32-fixtures/guest_arm32_vfp" \
            -DRETROBRIDGE_ARM32_SHARED_LIBRARY="$GITHUB_WORKSPACE/native/build/arm32-fixtures/libretrobridge_fixture.so" \
            -DRETROBRIDGE_ARM32_DEMO_SHARED_LIBRARY="$GITHUB_WORKSPACE/native/build/arm32-fixtures/libretrobridge_demo.so"
          cmake --build native/build/host --parallel 2 2>&1 | tee diagnostics/native-build.log
          ctest --test-dir native/build/host --output-on-failure 2>&1 | tee diagnostics/ctest.log

      - name: Measure host interpreter baseline (informational)
        shell: bash
        run: |
          set -euo pipefail
          native/build/host/retrobridge_arm32_benchmark 2000000 \
            | tee diagnostics/arm32-interpreter-benchmark.json

      - name: Build Android app and instrumentation APK; run Gradle unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            :core:runtime:lintDebug \
            :app:testDebugUnitTest \
            :core:runtime:testDebugUnitTest \
            :core:manager:test \
            :core:fs:test \
            :core:services:test 2>&1 | tee diagnostics/gradle.log

      - name: Install and boot Android x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > diagnostics/emulator-setup.log 2>&1
          set -x
          echo "Provisioning Android emulator for instrumentation tests"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [[ ! -x "$AVDMANAGER" ]]; then AVDMANAGER="$(command -v avdmanager || true)"; fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager is unavailable under $ANDROID_HOME or PATH." >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 127
          fi
          if [[ -z "$AVDMANAGER" || ! -x "$AVDMANAGER" ]]; then
            echo "Android avdmanager is unavailable under $ANDROID_HOME or PATH." >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name avdmanager -print >&2 || true
            exit 127
          fi
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          if [[ ! -x "$EMULATOR" ]]; then
            path_emulator="$(command -v emulator || true)"
            [[ -z "$path_emulator" ]] || EMULATOR="$path_emulator"
          fi
          SYSTEM_IMAGE="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          packages=()
          [[ -x "$ADB" ]] || packages+=("platform-tools")
          [[ -d "$SYSTEM_IMAGE" ]] || packages+=("system-images;android-35;google_apis;x86_64")
          [[ -x "$EMULATOR" ]] || packages+=("emulator")
          echo "SDK packages requested: ${packages[*]:-none}"
          SDKMANAGER_LOG=diagnostics/emulator-sdkmanager.log
          install_sdk_package() {
            local package="$1" target="$2" attempt status=1 details
            for attempt in 1 2 3; do
              echo "Installing SDK package '$package' (attempt $attempt of 3)."
              if "$SDKMANAGER" --install "$package" >"$SDKMANAGER_LOG" 2>&1; then
                echo "sdkmanager installed '$package' on attempt $attempt."
                tr '\r' '\n' < "$SDKMANAGER_LOG" | tail -n 20
                return 0
              else
                status=$?
                echo "sdkmanager failed installing '$package' with exit code $status."
                details="$(tr '\r' '\n' < "$SDKMANAGER_LOG" | grep -Ei '(^|[^[:alpha:]])(error|warning|failed|unknown archive|invalid|corrupt|exception)([^[:alpha:]]|$)' | tail -n 20 || true)"
                if [[ -n "$details" ]]; then
                  printf '%s\n' "$details"
                else
                  tr '\r' '\n' < "$SDKMANAGER_LOG" | tail -n 10
                fi
                if (( attempt < 3 )); then
                  echo "Removing incomplete package directory '$target' before retry."
                  rm -rf -- "$target"
                  sleep "$((attempt * 5))"
                fi
              fi
            done
            return "$status"
          }
          for package in "${packages[@]}"; do
            case "$package" in
              platform-tools) package_dir="$ANDROID_HOME/platform-tools" ;;
              emulator) package_dir="$ANDROID_HOME/emulator" ;;
              'system-images;android-35;google_apis;x86_64') package_dir="$SYSTEM_IMAGE" ;;
              *) echo "Unexpected Android SDK package '$package'." >&2; exit 2 ;;
            esac
            install_sdk_package "$package" "$package_dir"
          done
          if [[ ! -x "$ADB" || ! -x "$EMULATOR" || ! -d "$SYSTEM_IMAGE" ]]; then
            echo "Android emulator tooling or API 35 x86_64 system image is unavailable after provisioning." >&2
            ls -la "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-35/google_apis" >&2 || true
            exit 127
          fi
          echo "Using sdkmanager=$SDKMANAGER avdmanager=$AVDMANAGER adb=$ADB emulator=$EMULATOR system_image=$SYSTEM_IMAGE"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          AVD_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/retrobridge-avd"
          ANDROID_SDK_HOME="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/retrobridge-sdk-home"
          export ANDROID_AVD_HOME="$AVD_ROOT" ANDROID_SDK_HOME
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME"
          echo "HOME=$HOME ANDROID_AVD_HOME=$ANDROID_AVD_HOME ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          AVDMANAGER_LOG=diagnostics/emulator-avdmanager.log
          if echo no | "$AVDMANAGER" create avd --force --name retrobridge-ci \
            --path "$ANDROID_AVD_HOME/retrobridge-ci.avd" \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_2 >"$AVDMANAGER_LOG" 2>&1; then
            tail -n 40 "$AVDMANAGER_LOG"
          else
            avdmanager_status=$?
            echo "avdmanager failed with exit code $avdmanager_status"
            tail -n 80 "$AVDMANAGER_LOG"
            exit "$avdmanager_status"
          fi
          "$EMULATOR" -list-avds | tee diagnostics/emulator-avds.log
          if ! grep -Fxq retrobridge-ci diagnostics/emulator-avds.log; then
            echo "avdmanager did not register retrobridge-ci under ANDROID_AVD_HOME." >&2
            find "$ANDROID_AVD_HOME" -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi
          AVD_CONFIG="$ANDROID_AVD_HOME/retrobridge-ci.avd/config.ini"
          if grep -q '^disk\.dataPartition\.size=' "$AVD_CONFIG"; then
            sed -i 's/^disk\.dataPartition\.size=.*/disk.dataPartition.size=2G/' "$AVD_CONFIG"
          else
            echo 'disk.dataPartition.size=2G' >> "$AVD_CONFIG"
          fi
          grep -E '^disk\.dataPartition\.size=' "$AVD_CONFIG"
          if [[ ! -e /dev/kvm ]]; then
            echo "The runner does not expose /dev/kvm; the x86_64 emulator cannot use hardware acceleration." >&2
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "The current runner user still cannot access /dev/kvm after permission adjustment." >&2
            id >&2
            exit 1
          fi
          "$EMULATOR" -avd retrobridge-ci -no-window -no-audio \
            -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -accel auto \
            -verbose -show-kernel > diagnostics/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "Started Android emulator process $EMULATOR_PID"
          if ! timeout 300 "$ADB" wait-for-device; then
            echo "adb did not observe the emulator within 300 seconds." >&2
            "$ADB" devices -l >&2 || true
            ps -p "$EMULATOR_PID" -o pid=,stat=,args= >&2 || true
            tail -n 200 diagnostics/emulator.log >&2 || true
            exit 1
          fi
          "$ADB" devices -l
          booted=false
          for attempt in $(seq 1 90); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != true ]]; then
            echo "Android emulator did not finish booting." >&2
            tail -n 120 diagnostics/emulator.log >&2 || true
            exit 1
          fi
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82

      - name: Run Compose UI regression and signed ARM32 demo through guest_runtime on emulator
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain \
            :app:connectedDebugAndroidTest 2>&1 | tee diagnostics/emulator-instrumentation.log

      - name: Surface failure diagnostic tails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          for log in diagnostics/emulator-setup.log diagnostics/emulator-sdkmanager.log diagnostics/emulator-avdmanager.log diagnostics/emulator-avds.log diagnostics/emulator.log diagnostics/emulator-instrumentation.log diagnostics/gradle.log diagnostics/demo-apk.log diagnostics/ctest.log diagnostics/native-build.log diagnostics/arm32-fixtures.log diagnostics/arm32-demo-dynamic-dependencies.log diagnostics/arm32-demo-disassembly.log diagnostics/arm32-vfp-disassembly.log diagnostics/arm32-interpreter-benchmark.json diagnostics/demo-apk-zipalign.log diagnostics/demo-apk-signature.log; do
            if [[ -s "$log" ]]; then
              echo "### $log (diagnostic tail)" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              if [[ "$log" == *sdkmanager.log ]]; then
                { tr '\r' '\n' < "$log" | grep -Ei '(^|[^[:alpha:]])(error|warning|failed|unknown archive|invalid|corrupt|exception)([^[:alpha:]]|$)' | tail -n 25 || true; echo '--- final progress ---'; tr '\r' '\n' < "$log" | tail -n 5; } >> "$GITHUB_STEP_SUMMARY"
              elif [[ "$log" == *emulator.log ]]; then
                { grep -Ei 'ERROR|FATAL|PANIC|failed|failure|timed out|could not|cannot|not found|boot completed|adb' "$log" | tail -n 30 || true; echo '--- final emulator output ---'; tail -n 30 "$log"; } >> "$GITHUB_STEP_SUMMARY"
              else
                tail -n 100 "$log" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              if [[ "$log" == *gradle.log ]]; then
                message="$( { grep -n -E 'FAILURE:|What went wrong|Execution failed|FAILED|error:|e: |Caused by:|Could not resolve|A problem occurred' "$log" | tail -n 100 || true; echo '--- last 50 lines ---'; tail -n 50 "$log"; } | base64 -w0)"
              elif [[ "$log" == *emulator-instrumentation.log ]]; then
                message="$( { grep -n -B 6 -A 14 -E -i 'FAILED|FAILURES!!!|Tests? on .* failed|tests? [0-9]+/[0-9]+ completed|java.lang.(AssertionError|IllegalStateException|RuntimeException)|Expected:|found [0-9]+ nodes' "$log" | tail -n 80 || true; echo '--- final output ---'; tail -n 15 "$log"; } | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:2800])' | base64 -w0)"
              elif [[ "$log" == *sdkmanager.log ]]; then
                message="$( { tr '\r' '\n' < "$log" | grep -Ei '(^|[^[:alpha:]])(error|warning|failed|unknown archive|invalid|corrupt|exception)([^[:alpha:]]|$)' | tail -n 25 || true; echo '--- final progress ---'; tr '\r' '\n' < "$log" | tail -n 5; } | base64 -w0)"
              elif [[ "$log" == *emulator.log ]]; then
                message="$( { grep -Ei 'ERROR|FATAL|PANIC|failed|failure|timed out|could not|cannot|not found|boot completed|adb' "$log" | tail -n 30 || true; echo '--- final emulator output ---'; tail -n 30 "$log"; } | tail -c 2500 | base64 -w0)"
              else
                message="$(tail -n 100 "$log" | base64 -w0)"
              fi
              echo "::error title=RetroBridge diagnostic base64 ($log)::$message"
            fi
          done
          native_errors="$(grep -n -E 'error:|fatal error:|undefined reference|FAILED:' diagnostics/native-build.log 2>/dev/null | tail -n 40 || true)"
          if [[ -n "$native_errors" ]]; then
            echo "### Native compiler errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$native_errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=RetroBridge native compiler errors::$native_errors"
          fi
          test_failures="$(find . -type f -name '*.xml' \
            \( -path '*/build/test-results/*' \
              -o -path '*/build/outputs/androidTest-results/connected/*' \
              -o -path '*/build/reports/androidTests/connected/*' \) \
            -exec grep -H -n -A 12 -B 2 -E '<failure|<error' {} + || true)"
          if [[ -n "$test_failures" ]]; then
            echo "::error title=RetroBridge JUnit failures base64::$(printf '%s' "$test_failures" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:2800])' | base64 -w0)"
          fi
          android_test_reports="$(
            for root in app/build/outputs/androidTest-results app/build/reports/androidTests; do
              if [[ -d "$root" ]]; then
                find "$root" -type f \
                  \( -name '*.xml' -o -name '*.txt' -o -name '*.html' \) -print | sort
                grep -R -n -i -E 'failure|failed|assertion|exception|expected|actual' "$root" \
                  --include='*.xml' --include='*.txt' --include='*.html' | tail -n 80 || true
              else
                echo "$root: no report directory"
              fi
            done
          )"
          if [[ -n "$android_test_reports" ]]; then
            echo "::error title=RetroBridge Android test reports base64::$(printf '%s' "$android_test_reports" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:2800])' | base64 -w0)"
          fi

      - name: Upload APKs, ELF fixtures, test binaries, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrobridge-ci-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            native/fixtures/demo-apk/build/outputs/apk/debug/*.apk
            native/build/arm32-fixtures/*
            native/build/arm32-fixtures/test-assets/*.apk
            native/build/host/retrobridge_native_tests
            native/build/host/retrobridge_elf_inspect
            native/build/host/retrobridge_arm32_fixture_runner
            native/build/host/retrobridge_native_session_demo_runner
            native/build/host/retrobridge_arm32_benchmark
            native/build/host/Testing/Temporary/LastTest.log
            diagnostics/*.log
            diagnostics/arm32-interpreter-benchmark.json
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/outputs/androidTest-results/connected/**
